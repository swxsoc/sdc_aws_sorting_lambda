version: 0.2

phases:
  pre_build:
    commands:
      - echo Installing Miniconda...
      - curl -O https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
      - bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda
      - rm -f Miniconda3-latest-Linux-x86_64.sh
      - echo 'export PATH="$HOME/miniconda/bin:$PATH"' >> $HOME/.bashrc
      - source $HOME/.bashrc
      - conda init bash
      - source $HOME/.bashrc
      - echo Creating a Python 3.10 environment...
      - conda create -n myenv python=3.10 -y
      - echo 'conda activate myenv' >> $HOME/.bashrc
      - source $HOME/.bashrc
      
      - echo Installing CI/CD Dependencies...
      - pip install flake8 black pytest pytest-astropy pytest-cov
      - pip install pytest pytest-astropy pytest-cov
      - pip install -r requirements.dev.txt
      - echo ________________________________

      - echo Linting with Black...
      - black --check --diff lambda_function
      - echo ________________________________
      
      - echo Linting with Flake...
      - echo ________________________________

  build:
    commands:
    - |
      set -eu

      case "${CODEBUILD_WEBHOOK_EVENT:-}" in
        PULL_REQUEST_*)
          echo "Pull request build: skipping image push and deployment"
          exit 0
          ;;
      esac

      REGION=us-east-1
      PUBLIC_ECR_NAMESPACE=public.ecr.aws/w5r9l1c8
      PROJECT_NAME=${CODEBUILD_BUILD_ID%%:*}
      PROJECT_MISSION=${PROJECT_NAME#build_}
      PROJECT_MISSION=${PROJECT_MISSION%_sdc_aws_sorting_lambda}
      MISSION_NAME=${MISSION_NAME:-${PROJECT_MISSION:-hermes}}
      MISSION_SLUG=$(printf '%s' "${MISSION_NAME}" | tr '_' '-')

      if [ "${MISSION_NAME}" = "hermes" ]; then
        ECR_REPO_NAME=sdc_aws_sorting_lambda
        BASE_IMAGE_NAME=swsoc-docker-lambda-base:latest
      else
        ECR_REPO_NAME=${MISSION_NAME}_sdc_aws_sorting_lambda
        BASE_IMAGE_NAME=${MISSION_SLUG}-swsoc-docker-lambda-base:latest
      fi

      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

      if git describe --tags --exact-match > /dev/null 2>&1; then
        echo "This is a tag push event"
        CDK_ENVIRONMENT=PRODUCTION
        VERSION=$(git describe --tags --exact-match)
      elif [ "${CDK_ENVIRONMENT:-}" = "PRODUCTION" ]; then
        echo "This is a production environment"
        CDK_ENVIRONMENT=PRODUCTION
        VERSION=$(date -u +"%Y%m%d%H%M%S")
      else
        echo "This is a development environment"
        CDK_ENVIRONMENT=DEVELOPMENT
        ECR_REPO_NAME=dev-${ECR_REPO_NAME}
        BASE_IMAGE_NAME=dev-${BASE_IMAGE_NAME}
        VERSION=$(date -u +"%Y%m%d%H%M%S")
      fi

      ECR_REPO=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${ECR_REPO_NAME}
      BASE_IMAGE=${PUBLIC_ECR_NAMESPACE}/${BASE_IMAGE_NAME}
      docker build --build-arg BASE_IMAGE="${BASE_IMAGE}" -t "${ECR_REPO}:latest" lambda_function/.
      docker tag "${ECR_REPO}:latest" "${ECR_REPO}:${VERSION}"
      docker push "${ECR_REPO}:latest"
      docker push "${ECR_REPO}:${VERSION}"

      aws codebuild start-build \
        --project-name "build_${MISSION_NAME}_sdc_aws_pipeline_architecture" \
        --region us-east-1 \
        --environment-variables-override \
          name=CDK_ENVIRONMENT,value="${CDK_ENVIRONMENT}",type=PLAINTEXT \
          name=MISSION_NAME,value="${MISSION_NAME}",type=PLAINTEXT \
          name=LAMBDA_PIPELINE,value=SORTING,type=PLAINTEXT \
          name=TAG,value="${VERSION}",type=PLAINTEXT

  post_build:
    commands:
      - echo Build Successful - Lambda Successfully Built and Pushed to ECR
